<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>Skill Forge platform architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="760" fill="#ffffff"/>
  <text x="20" y="22" font-weight="600" fill="#475569">Consumers (per tenant)</text>
  <rect x="20" y="32" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="130" y="54" text-anchor="middle" font-weight="600">Setup script (static)</text>
  <text x="130" y="72" text-anchor="middle">skf-cloud install, pinned refs</text>
  <rect x="20" y="116" width="220" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="130" y="141" text-anchor="middle">~/.claude: rules, subagents, skills</text>
  <rect x="20" y="182" width="220" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="204" text-anchor="middle" font-weight="600">Agent thread / cloud session</text>
  <text x="130" y="222" text-anchor="middle">stats hook (metadata only)</text>
  <text x="130" y="238" text-anchor="middle" fill="#475569">MCP connector</text>
  <rect x="20" y="272" width="220" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="292" text-anchor="middle" font-weight="600">Workstation</text>
  <text x="130" y="308" text-anchor="middle">skf CLI, skf stats push</text>
  <rect x="20" y="342" width="220" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="362" text-anchor="middle" font-weight="600">Own eval runner (optional)</text>
  <text x="130" y="378" text-anchor="middle">posts results, ingest:eval</text>
  <rect x="20" y="420" width="220" height="44" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="130" y="440" text-anchor="middle" font-weight="600">Tenant members</text>
  <text x="130" y="456" text-anchor="middle">browser</text>
  <line x1="130" y1="90" x2="130" y2="114" stroke="#475569" marker-end="url(#a)"/>
  <line x1="130" y1="156" x2="130" y2="180" stroke="#475569" marker-end="url(#a)"/>

  <rect x="300" y="32" width="300" height="490" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="450" y="54" text-anchor="middle" font-weight="600">Skill Forge platform</text>
  <text x="450" y="70" text-anchor="middle" fill="#475569">all Go services; Deploybot containers</text>
  <rect x="320" y="86" width="260" height="58" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="450" y="106" text-anchor="middle" font-weight="600">Console: SvelteKit web app</text>
  <text x="450" y="122" text-anchor="middle">inventory · usage · evals · operations</text>
  <text x="450" y="137" text-anchor="middle" fill="#475569">GitHub sign-in, tenant roles</text>
  <rect x="320" y="166" width="260" height="96" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="450" y="186" text-anchor="middle" font-weight="600">API: Go (net/http, Go MCP SDK)</text>
  <text x="450" y="204" text-anchor="middle">REST for the web app</text>
  <text x="450" y="220" text-anchor="middle">MCP endpoint (Streamable HTTP)</text>
  <text x="450" y="236" text-anchor="middle">/ingest/v1: usage events, eval runs</text>
  <text x="450" y="252" text-anchor="middle" fill="#475569">OAuth 2.1 server, tenant-scoped tokens</text>
  <rect x="320" y="284" width="260" height="96" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="450" y="302" text-anchor="middle" font-weight="600">Dispatcher (Go)</text>
  <text x="450" y="318" text-anchor="middle">claims queue rows, submits to DD job API,</text>
  <text x="450" y="333" text-anchor="middle">writes results back (sends key id, not key)</text>
  <line x1="330" y1="342" x2="570" y2="342" stroke="#16a34a" stroke-dasharray="3 3"/>
  <text x="450" y="358" text-anchor="middle" font-weight="600">Committer (Go): only holder of App key</text>
  <text x="450" y="373" text-anchor="middle" fill="#475569">separate container, KMS-signed JWT</text>
  <rect x="320" y="408" width="260" height="96" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="450" y="430" text-anchor="middle" font-weight="600">Postgres (Supabase)</text>
  <text x="450" y="448" text-anchor="middle">tenant_id on every row,</text>
  <text x="450" y="464" text-anchor="middle">row-level security</text>
  <text x="450" y="482" text-anchor="middle">jobs · events · eval history · tokens</text>
  <text x="450" y="496" text-anchor="middle" fill="#475569">no prompts, code or transcripts</text>
  <line x1="450" y1="144" x2="450" y2="164" stroke="#475569" marker-end="url(#a)"/>
  <line x1="450" y1="262" x2="450" y2="282" stroke="#475569" marker-end="url(#a)"/>
  <text x="458" y="277" fill="#475569" font-size="10">jobs via Postgres queue only</text>
  <line x1="450" y1="380" x2="450" y2="406" stroke="#475569" marker-end="url(#a)"/>
  <path d="M580,214 C614,214 614,456 582,456" fill="none" stroke="#475569" marker-end="url(#a)"/>

  <line x1="240" y1="222" x2="318" y2="218" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="246" y="208" fill="#2563eb" font-size="10">MCP, hook events</text>
  <line x1="240" y1="294" x2="318" y2="236" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="240" y1="364" x2="318" y2="244" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="244" y="334" fill="#2563eb" font-size="10">ingest token</text>
  <line x1="240" y1="436" x2="318" y2="122" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="660" y="32" width="260" height="400" rx="12" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="790" y="54" text-anchor="middle" font-weight="600">GitHub</text>
  <text x="790" y="70" text-anchor="middle" fill="#475569">registries stay in git (source of truth)</text>
  <rect x="676" y="84" width="228" height="74" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="790" y="104" text-anchor="middle" font-weight="600">Public catalog</text>
  <text x="790" y="122" text-anchor="middle">more-than-code/skill-forge</text>
  <text x="790" y="140" text-anchor="middle" fill="#475569">readable by every tenant</text>
  <rect x="676" y="174" width="228" height="74" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="790" y="194" text-anchor="middle" font-weight="600">Tenant registry repos</text>
  <text x="790" y="212" text-anchor="middle">private skills, App installed</text>
  <text x="790" y="230" text-anchor="middle" fill="#475569">one or more per tenant</text>
  <rect x="676" y="264" width="228" height="58" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="790" y="284" text-anchor="middle">proposal/* branches</text>
  <text x="790" y="300" text-anchor="middle">+ draft PRs, feedback issues</text>
  <text x="790" y="314" text-anchor="middle" fill="#475569" font-size="10">protection checked before every job</text>
  <rect x="676" y="338" width="228" height="44" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="790" y="358" text-anchor="middle">CI per registry (no secrets)</text>
  <text x="790" y="374" text-anchor="middle" fill="#475569">npm test, lock, validate</text>
  <line x1="580" y1="322" x2="674" y2="294" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="620" y="330" fill="#7c3aed" font-size="10">App: PR</text>
  <line x1="674" y1="212" x2="582" y2="338" stroke="#475569" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="626" y="252" fill="#475569" font-size="10">mirror</text>

  <rect x="660" y="452" width="260" height="70" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="790" y="474" text-anchor="middle" font-weight="600">Registry maintainers (per tenant)</text>
  <text x="790" y="492" text-anchor="middle">review and merge every PR, move pins</text>
  <text x="790" y="508" text-anchor="middle">the platform never merges</text>
  <line x1="790" y1="452" x2="790" y2="434" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M676,100 C520,24 340,24 242,50" fill="none" stroke="#475569" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="330" y="24" fill="#475569" font-size="10">pinned files at setup (public, or private via a registry token)</text>

  <rect x="300" y="548" width="620" height="196" rx="12" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="610" y="570" text-anchor="middle" font-weight="600">Defect Drainer (general-purpose job runner)</text>
  <text x="610" y="586" text-anchor="middle" fill="#475569">jobs + key id in, results out; no Skill Forge GitHub credentials</text>
  <rect x="320" y="600" width="250" height="128" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="445" y="620" text-anchor="middle" font-weight="600">Control plane (Go)</text>
  <text x="445" y="638" text-anchor="middle">generic job API (kind, inputs,</text>
  <text x="445" y="654" text-anchor="middle">sandbox, key ref, result schema)</text>
  <text x="445" y="676" text-anchor="middle" font-weight="600">Bring your own key</text>
  <text x="445" y="694" text-anchor="middle">tenant model keys, envelope-</text>
  <text x="445" y="710" text-anchor="middle">encrypted, added in the Console</text>
  <rect x="590" y="600" width="314" height="128" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="747" y="620" text-anchor="middle" font-weight="600">DD worker (Go): sandbox per job</text>
  <text x="747" y="638" text-anchor="middle">sf.check · sf.propose: skf CLI (no network)</text>
  <text x="747" y="654" text-anchor="middle">sf.eval: Claude Code in an empty config,</text>
  <text x="747" y="670" text-anchor="middle">then promptfoo CLI grades</text>
  <text x="747" y="690" text-anchor="middle">Node 22 = runtime for the two CLIs only</text>
  <text x="747" y="710" text-anchor="middle" fill="#475569">key in memory only → model API; no git token</text>
  <line x1="570" y1="664" x2="588" y2="664" stroke="#475569" marker-end="url(#a)"/>
  <path d="M320,312 L310,312 L310,598" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M318,710 L304,710 L304,332 L318,332" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="296" y="560" fill="#0f766e" font-size="10" text-anchor="end">jobs (key id) ↓</text>
  <text x="296" y="574" fill="#0f766e" font-size="10" text-anchor="end">results ↑ (eval records)</text>
</svg>
